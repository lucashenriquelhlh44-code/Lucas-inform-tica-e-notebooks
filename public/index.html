<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucas Informática e Notebooks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; line-height: 1.6; padding: 15px; }
    
    .container { max-width: 600px; margin: 0 auto; }
    
    header { 
      background: linear-gradient(135deg, #0d6efd, #0a58ca); 
      color: white; 
      padding: 24px 20px; 
      border-radius: 12px; 
      text-align: center; 
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
    }
    header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    header p { font-size: 0.95rem; opacity: 0.9; margin-bottom: 12px; }
    
    .contact-info { 
      display: flex; 
      justify-content: center; 
      gap: 12px; 
      flex-wrap: wrap; 
      font-size: 0.85rem; 
    }
    .badge { 
      background: rgba(255, 255, 255, 0.2); 
      padding: 4px 10px; 
      border-radius: 20px; 
      backdrop-filter: blur(5px);
    }

    .card { 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      margin-bottom: 20px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
    }
    .card-title { 
      font-size: 1.1rem; 
      color: #0d6efd; 
      border-bottom: 2px solid #eef2f6; 
      padding-bottom: 8px; 
      margin-bottom: 16px; 
      display: flex; 
      align-items: center; 
      gap: 8px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: #495057; }
    .form-control { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #ced4da; 
      border-radius: 8px; 
      font-size: 0.95rem; 
      transition: all 0.2s ease-in-out; 
    }
    .form-control:focus { 
      border-color: #0d6efd; 
      outline: none; 
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15); 
    }

    .btn-submit { 
      width: 100%; 
      background: #198754; 
      color: white; 
      border: none; 
      padding: 14px; 
      font-size: 1rem; 
      font-weight: 600; 
      border-radius: 8px; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(25, 135, 84, 0.2); 
      transition: background 0.2s, transform 0.1s;
    }
    .btn-submit:hover { background: #157347; }
    .btn-submit:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Lucas Informática e Notebooks</h1>
      <p>Manutenção Especializada em Notebooks & Venda de Equipamentos</p>
      <div class="contact-info">
        <span class="badge">📍 Vila Velha - ES</span>
        <span class="badge">💬 (27) 99999-9999</span>
      </div>
    </header>

    <form id="osForm">
      <div class="card">
        <div class="card-title">📋 Abertura de Ordem de Serviço (O.S.)</div>
        
        <div class="form-group">
          <label for="nome">Nome Completo *</label>
          <input type="text" id="nome" class="form-control" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF / CNPJ *</label>
          <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone / WhatsApp *</label>
          <input type="tel" id="telefone" class="form-control" placeholder="(27) 99999-9999" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail *</label>
          <input type="email" id="email" class="form-control" placeholder="seuemail@exemplo.com" required>
        </div>
      </div>

      <div class="card">
        <div class="card-title">💻 Dados do Equipamento</div>

        <div class="form-group">
          <label for="modelo">Marca / Modelo *</label>
          <input type="text" id="modelo" class="form-control" placeholder="Ex: Dell Inspiron 15" required>
        </div>

        <div class="form-group">
          <label for="serie">Número de Série (S/N)</label>
          <input type="text" id="serie" class="form-control" placeholder="Opcional">
        </div>

        <div class="form-group">
          <label for="senha">Senha do Windows / PIN</label>
          <input type="text" id="senha" class="form-control" placeholder="Deixe em branco se não desejar informar">
        </div>
      </div>

      <div class="card">
        <div class="card-title">📝 Defeito Relatado</div>
        
        <div class="form-group">
          <label for="defeito">Descrição do Problema *</label>
          <textarea id="defeito" class="form-control" rows="3" placeholder="Descreva o defeito do equipamento..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">🚀 Abrir Ordem de Serviço</button>
      </div>
    </form>
  </div>

</body>
</html>
