<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordens de Serviço - Painel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f1115; color: #e1e1e6; line-height: 1.6; padding: 15px; }
    .container { max-width: 700px; margin: 0 auto; }
    header { 
      background: linear-gradient(145deg, #1e2229, #16181d); 
      color: #ffffff; padding: 24px 20px; border-radius: 16px; 
      text-align: center; margin-bottom: 20px; border: 1px solid #2a2e37;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; color: #c77dff; margin-bottom: 6px; }
    header p { font-size: 0.9rem; color: #a8b2d1; }
    .btn-voltar {
      display: inline-block; margin-bottom: 15px; background: #2a2e37;
      color: #ffffff; padding: 8px 14px; border-radius: 8px; text-decoration: none;
      font-size: 0.85rem; font-weight: 600;
    }
    .os-card { 
      background: #181b20; padding: 20px; border-radius: 16px; 
      margin-bottom: 15px; border: 1px solid #262a33; 
    }
    .os-header { 
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #2a2e37; padding-bottom: 10px; margin-bottom: 12px; 
    }
    .os-cliente { font-size: 1.05rem; font-weight: 700; color: #ffffff; }
    .os-tel { font-size: 0.85rem; background: #2a2e37; padding: 4px 10px; border-radius: 20px; color: #c77dff; }
    .os-body p { font-size: 0.9rem; margin-bottom: 6px; color: #d1d5db; }
    .os-body strong { color: #a0aec0; }
    .defeito-box {
      background: #0f1115; border: 1px solid #2d323e; border-radius: 8px;
      padding: 10px; margin-top: 10px; color: #ffb703; font-size: 0.9rem;
    }
    .loading, .empty-msg { text-align: center; color: #a0aec0; margin-top: 30px; }
    /* Estilo do Pop-up de Notificação */
.popup-notificacao {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #2a2e37;
  border-left: 5px solid #4ade80;
  color: #ffffff;
  padding: 16px 20px;
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  z-index: 9999;
  animation: slideIn 0.4s ease-out;
}

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="btn-voltar">← Voltar para o Formulário</a>
    <header>
      <h1>Painel de Ordens de Serviço</h1>
      <p>Acompanhe os equipamentos recebidos</p>
    </header>
    <div id="listaOrdens" class="loading">Carregando ordens de serviço...</div>
  </div>

  <script>
    fetch('/api/ordens')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('listaOrdens');
        if (!data || data.length === 0) {
          container.className = 'empty-msg';
          container.innerHTML = '<p>Nenhuma ordem de serviço cadastrada até o momento.</p>';
          return;
        }

        container.innerHTML = '';
        data.reverse().forEach(os => {
          container.innerHTML += `
            <div class="os-card">
              <div class="os-header">
                <span class="os-cliente">👤 ${os.cliente_nome}</span>
                <span class="os-tel">📞 ${os.cliente_telefone}</span>
              </div>
              <div class="os-body">
                <p><strong>CPF/CNPJ:</strong> ${os.cliente_cpf || 'Não informado'}</p>
                <p><strong>E-mail:</strong> ${os.cliente_email || 'Não informado'}</p>
                <p><strong>Endereço:</strong> ${os.rua}, ${os.numero} - ${os.bairro}, ${os.cidade} (CEP: ${os.cep || 'N/A'})</p>
                <p><strong>Equipamento:</strong> ${os.equipamento_modelo} | <strong>S/N:</strong> ${os.numero_serie || 'Não informado'}</p>
                <p><strong>Status OS:</strong> <span style="color: #4ade80;">${os.status_os || 'Em Análise'}</span></p>
                <div class="defeito-box">
                  <strong>Defeito Relatado:</strong><br>${os.defeito_relatado}
                </div>
              </div>
            </div>
          `;
        });
      })
      .catch(() => {
        document.getElementById('listaOrdens').className = 'empty-msg';
        document.getElementById('listaOrdens').innerHTML = '<p style="color: #ff6b6b;">Erro ao carregar as ordens de serviço.</p>';
      });
  </script>
</body>
</html>
